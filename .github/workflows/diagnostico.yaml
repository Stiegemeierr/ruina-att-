name: Diagnostico Actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar inicializacao do runner
        run: |
          echo "Runner iniciado; nenhuma credencial ou reserva utilizada."
          date -u
          python3 --version
