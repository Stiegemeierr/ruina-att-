name: Ruina

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run simula; auth-check testa login; reserve cria reservas reais'
        type: choice
        default: dry-run
        options: [dry-run, auth-check, reserve]
      date:
        description: 'Data da refeicao AAAA-MM-DD (vazio = amanha em Brasilia)'
        required: false
        type: string
      restaurant:
        description: 'Filtrar RU (vazio = todos da agenda)'
        required: false
        type: string
      meal:
        description: 'Filtrar refeicao para teste controlado'
        type: choice
        default: all
        options: [all, coffee, lunch, dinner]
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: ruina-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  ruina:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Executar modo escolhido
        env:
          UFSM_USERNAME: ${{ secrets.Username }}
          UFSM_PASSWORD: ${{ secrets.Password }}
          RUINA_MODE: ${{ inputs.mode || (vars.RUINA_ENABLE_SCHEDULING == 'true' && 'reserve' || 'dry-run') }}
          RUINA_DATE: ${{ inputs.date }}
          RUINA_RESTAURANT: ${{ inputs.restaurant }}
          RUINA_MEAL: ${{ inputs.meal }}
        run: |
          args=("--$RUINA_MODE")
          if [ -n "$RUINA_DATE" ]; then
            args+=(--date "$RUINA_DATE")
          fi
          if [ -n "$RUINA_RESTAURANT" ]; then
            args+=(--restaurant "$RUINA_RESTAURANT")
          fi
          if [ -n "$RUINA_MEAL" ] && [ "$RUINA_MEAL" != "all" ]; then
            args+=(--meal "$RUINA_MEAL")
          fi
          python main.py "${args[@]}"
